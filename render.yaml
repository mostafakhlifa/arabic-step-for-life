# Render Blueprint — deploys Arabic Step for Life (Node/Express + PostgreSQL)
# in one click from this repo: Render Dashboard → New → Blueprint → pick this repo.
# Free tier: web service + PostgreSQL. After deploy, set APP_URL to the Render
# URL in the dashboard, add the org's Stripe TEST keys + SMTP, then create the
# admin account from the Render shell: npm run db:seed (with SEED_ADMIN_* set).
services:
  - type: web
    name: arabic-step-for-life
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: arabic-step-for-life-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: arabic-step-for-life-db
    plan: free
