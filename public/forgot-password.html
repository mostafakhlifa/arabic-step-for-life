<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Arabic Step for Life Organization, Inc.</title>
<meta name="description" content="Request a password reset link for your account.">
<meta name="theme-color" content="#115759">
<link rel="icon" type="image/png" href="/assets/logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js" defer></script>
<script src="/js/layout.js" defer></script>
<script src="/js/auth.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main id="main-content">
  <section class="section">
    <div class="container">
      <div class="form-card">
        <div class="center">
          <span class="eyebrow">Password Recovery</span>
          <h2>Forgot your password?</h2>
          <p class="lead">Enter the email address you registered with and we will send you a link to reset your password.</p>
        </div>
        <div id="auth-alert" class="alert hidden mt-3" role="alert"></div>
        <form id="forgot-form" class="mt-3" novalidate>
          <div class="form-group">
            <label for="email">Email <span class="req">*</span></label>
            <input type="email" id="email" required autocomplete="email">
          </div>
          <button class="btn btn-teal btn-block" type="submit">Send Reset Link</button>
        </form>
        <p class="center mt-3"><a href="/login.html">← Back to login</a></p>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
</body>
</html>
