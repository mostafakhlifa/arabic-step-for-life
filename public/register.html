<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an Account — Arabic Step for Life Organization, Inc.</title>
<meta name="description" content="Create your free account to apply for programs and track your applications.">
<meta name="theme-color" content="#115759">
<link rel="icon" type="image/png" href="/assets/logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js" defer></script>
<script src="/js/layout.js" defer></script>
<script src="/js/auth.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main id="main-content">
  <section class="section">
    <div class="container">
      <div class="form-card">
        <div class="center">
          <span class="eyebrow">Join Our Community</span>
          <h2>Create your account</h2>
          <p class="lead">One account lets you apply for programs, track your applications, and message our team.</p>
        </div>
        <div id="auth-alert" class="alert hidden mt-3" role="alert"></div>
        <form id="register-form" class="mt-3" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First name <span class="req">*</span></label>
              <input type="text" id="firstName" required autocomplete="given-name">
            </div>
            <div class="form-group">
              <label for="lastName">Last name <span class="req">*</span></label>
              <input type="text" id="lastName" required autocomplete="family-name">
            </div>
          </div>
          <div class="form-group">
            <label for="email">Email <span class="req">*</span></label>
            <input type="email" id="email" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="phone">Phone (optional)</label>
            <input type="tel" id="phone" autocomplete="tel">
          </div>
          <div class="form-group">
            <label for="password">Password <span class="req">*</span></label>
            <input type="password" id="password" required minlength="8" autocomplete="new-password">
            <p class="form-hint">At least 8 characters.</p>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm password <span class="req">*</span></label>
            <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password">
          </div>
          <button class="btn btn-teal btn-block" type="submit">Create My Account</button>
        </form>
        <p class="center mt-3">Already have an account? <a href="/login.html">Login here</a></p>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
</body>
</html>
