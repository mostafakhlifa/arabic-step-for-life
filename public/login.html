<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Arabic Step for Life Organization, Inc.</title>
<meta name="description" content="Log in to your Arabic Step for Life account.">
<meta name="theme-color" content="#115759">
<link rel="icon" type="image/png" href="/assets/logo/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/api.js" defer></script>
<script src="/js/layout.js" defer></script>
<script src="/js/auth.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<main id="main-content">
  <section class="section">
    <div class="container">
      <div class="form-card">
        <div class="center">
          <span class="eyebrow">Welcome Back</span>
          <h2>Login to your account</h2>
          <p class="lead">Access your dashboard, applications, messages, and notifications.</p>
        </div>
        <div id="auth-alert" class="alert hidden mt-3" role="alert"></div>
        <form id="login-form" class="mt-3" novalidate>
          <div class="form-group">
            <label for="email">Email <span class="req">*</span></label>
            <input type="email" id="email" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Password <span class="req">*</span></label>
            <input type="password" id="password" required autocomplete="current-password">
          </div>
          <button class="btn btn-teal btn-block" type="submit">Login</button>
        </form>
        <p class="center mt-3"><a href="/forgot-password.html">Forgot your password?</a></p>
        <p class="center">Don't have an account yet? <a href="/register.html">Create one — it's free</a></p>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
</body>
</html>
